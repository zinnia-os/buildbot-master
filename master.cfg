# -*- python -*-
# ex: set filetype=python:

import os

import user_config
from buildbot.plugins import *

c = BuildmasterConfig = {}

current_dir = os.path.dirname(os.path.abspath(__file__))
secrets_dir = os.path.join(current_dir, user_config.secrets_dir)
jinx_path = f"../source/{user_config.jinx_path}"


def master_path(path):
    if os.path.isabs(path):
        return path
    return os.path.join(current_dir, path)


c["secretsProviders"] = [secrets.SecretInAFile(dirname=secrets_dir, strip=True)]

c["title"] = user_config.title
c["titleURL"] = user_config.title_url
c["buildbotURL"] = user_config.bot_url
c["services"] = []
c["www"] = {
    "port": user_config.www_port,
    "plugins": {
        "waterfall_view": {},
        "console_view": {},
        "grid_view": {},
    },
}
c["db"] = {"db_url": user_config.db_url}
c["protocols"] = {"pb": {"port": user_config.bot_port}}
c["workers"] = []
c["schedulers"] = []
c["builders"] = []
c["change_source"] = []

c["change_source"].append(
    changes.GitPoller(
        user_config.repo_url,
        name="poll_bootstrap",
        workdir="gitpoller-workdir",
        branch=user_config.repo_branch,
        pollInterval=user_config.update_secs,
    )
)


@util.renderer
def jinx_build(props, arch):
    ret = []
    pkgs = (props.getProperty("pkgs_unbuilt") or "").split()

    for p in pkgs:
        ret.append(
            util.ShellArg(
                command=[jinx_path, "build", p],
                logname=p,
                haltOnFailure=True,
            )
        )
    return ret


def path_not_exists(step):
    return not os.path.exists("")


def get_pkgs_unbuilt(rc, stdout: str, stderr: str):
    lines = stdout.splitlines()
    if len(lines) != 0:
        return {"pkgs_unbuilt": lines[-1].strip()}
    else:
        return {"pkgs_unbuilt": ""}


def get_pkgs_built(rc, stdout: str, stderr: str):
    return {"built_files": stdout.split()}


def host_results_dir(arch):
    return arch.get("host_results", os.path.join(arch["results"], "host"))


@util.renderer
def new_files(props, subdir, masterdest):
    paths = props.getProperty("built_files") or []
    try:
        existing = set(os.listdir(master_path(masterdest)))
    except OSError:
        existing = set()

    prefix = f"{subdir}/"
    ret = []
    for p in paths:
        if not p.startswith(prefix):
            continue
        name = p[len(prefix) :]
        if name.endswith(".xbps") and name not in existing:
            ret.append(p)
    return ret


def publish_command(results, arch):
    return [
        "/usr/local/bin/publish-xbps-repository",
        master_path(results),
        master_path(user_config.signing_key),
        user_config.signed_by,
        arch,
    ]


def find_compatible_worker_names(archs):
    ret = []
    for w in user_config.workers:
        if archs["name"] in w["archs"]:
            ret.append(w)
    return ret


def create_target(c, arch):
    arch_name = arch["name"]
    scheduler_name = f"scheduler-{arch_name}"
    builder_name = f"build-{arch_name}"

    # If there's at least one compatible worker, add the builder for it.
    worker_names = find_compatible_worker_names(arch)
    if len(worker_names) == 0:
        return

    c["schedulers"].append(
        schedulers.SingleBranchScheduler(
            name=scheduler_name,
            change_filter=util.ChangeFilter(branch=user_config.repo_branch),
            treeStableTimer=None,
            builderNames=[builder_name],
        )
    )

    # Scheduler for force rebuilds
    c["schedulers"].append(
        schedulers.ForceScheduler(
            name=f"force-{scheduler_name}",
            builderNames=[builder_name],
            buttonName=f"Force rebuild {builder_name}",
        )
    )

    f = util.BuildFactory()

    f.addStep(
        steps.Git(
            name="checkout_distro",
            description="Checking out distro sources",
            repourl=user_config.repo_url,
            branch=user_config.repo_branch,
            submodules=True,
            mode="incremental",
            workdir="source",
            logEnviron=False,
        )
    )
    f.addStep(
        steps.SetPropertyFromCommand(
            name="check_build_dir",
            command="if [ -f .jinx-parameters ]; then echo 1; else echo 0; fi",
            property="build_dir_exists",
            workdir="build",
            logEnviron=False,
        )
    )
    f.addStep(
        steps.ShellCommand(
            name="prepare_dir",
            description="Prepare build directory",
            command=[jinx_path, "init", "../source", f"ARCH={arch_name}"],
            workdir="build",
            logEnviron=False,
            doStepIf=lambda step: step.getProperty("build_dir_exists") == "0",
        )
    )
    f.addStep(
        steps.ShellCommand(
            name="download_host_pkgs",
            description="Downloading prebuilt host packages",
            command=[jinx_path, "download", "host:*"],
            workdir="build",
            logEnviron=False,
            haltOnFailure=False,
            flunkOnFailure=False,
            warnOnFailure=True,
        )
    )
    f.addStep(
        steps.ShellCommand(
            name="download_pkgs",
            description="Downloading prebuilt packages",
            command=[jinx_path, "download", "*"],
            workdir="build",
            logEnviron=False,
            haltOnFailure=False,
            flunkOnFailure=False,
            warnOnFailure=True,
        )
    )
    f.addStep(
        steps.SetPropertyFromCommand(
            name="find_unbuilt",
            description="Find unbuilt packages",
            command=[jinx_path, "dry-run", "*"],
            extract_fn=get_pkgs_unbuilt,
            workdir="build",
            logEnviron=False,
            haltOnFailure=True,
        )
    )
    f.addStep(
        steps.ShellSequence(
            name="build_pkgs",
            description="Build packages",
            commands=jinx_build.withArgs(arch),
            workdir="build",
            logEnviron=False,
            haltOnFailure=True,
        )
    )
    f.addStep(
        steps.SetPropertyFromCommand(
            name="list_pkgs",
            description="Listing built packages",
            command="find pkgs host-pkgs -maxdepth 1 -type f",
            extract_fn=get_pkgs_built,
            workdir="build",
            logEnviron=False,
            haltOnFailure=True,
        )
    )
    f.addStep(
        steps.MultipleFileUpload(
            name="upload_pkgs",
            description="Uploading new packages",
            workersrcs=new_files.withArgs("pkgs", arch["results"]),
            masterdest=arch["results"],
            workdir="build",
            mode=0o644,
        )
    )
    f.addStep(
        steps.MasterShellCommand(
            name="publish_pkgs",
            description="Indexing and signing target repository",
            command=publish_command(arch["results"], arch_name),
            haltOnFailure=True,
            logEnviron=False,
        )
    )
    f.addStep(
        steps.MultipleFileUpload(
            name="upload_host_pkgs",
            description="Uploading new host packages",
            workersrcs=new_files.withArgs("host-pkgs", host_results_dir(arch)),
            masterdest=host_results_dir(arch),
            workdir="build",
            mode=0o644,
        )
    )
    f.addStep(
        steps.MasterShellCommand(
            name="publish_host_pkgs",
            description="Indexing and signing host repository",
            command=publish_command(
                host_results_dir(arch), arch.get("host_arch", "x86_64")
            ),
            haltOnFailure=True,
            logEnviron=False,
        )
    )

    c["builders"].append(
        util.BuilderConfig(
            name=builder_name,
            workernames=[x["name"] for x in worker_names],
            factory=f,
        )
    )


c["www"]["authz"] = util.Authz(
    allowRules=[util.AnyControlEndpointMatcher(role="admin")],
    roleMatchers=[
        util.RolesFromUsername(roles=["admin"], usernames=list(user_config.admins))
    ],
)
c["www"]["auth"] = util.UserPasswordAuth(user_config.admins)

for w in user_config.workers:
    c["workers"].append(
        worker.Worker(
            w["name"],
            util.Secret(w["name"]),
            max_builds=w["max_builds"],
            properties={},
            defaultProperties={},
        )
    )

for a in user_config.archs:
    create_target(c, a)
